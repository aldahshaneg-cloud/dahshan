<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الدهشان | إدارة التقييمات</title>
<link rel="icon" href="assets/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#eff2f5; --panel:#ffffff; --hover:#f5f6f6; --active:#f0f2f5;
  --line:#e9edef; --line2:#d1d7db;
  --txt:#111b21; --muted:#667781; --soft:#8696a0;
  --brand:#d1172a; --brand-d:#a30f20; --brand-soft:rgba(209,23,42,.09);
  --green:#15803d; --green-soft:rgba(21,128,61,.1);
  --orange:#c2410c; --orange-soft:rgba(194,65,12,.1);
  --gold:#b45309; --gold-soft:rgba(180,83,9,.12);
  --blue:#1d4ed8;
  --font:'Cairo',system-ui,sans-serif; --hd:60px;
}
:root.dark{
  --bg:#0b141a; --panel:#111b21; --hover:#182229; --active:#2a3942;
  --line:#222d34; --line2:#2a3942;
  --txt:#e9edef; --muted:#8696a0; --soft:#667781;
  --brand:#e8192c; --brand-d:#b91c1c; --brand-soft:rgba(232,25,44,.14);
  --green:#22c55e; --green-soft:rgba(34,197,94,.14);
  --orange:#f97316; --orange-soft:rgba(249,115,22,.14);
  --gold:#f5b800; --gold-soft:rgba(245,184,0,.14);
  --blue:#60a5fa;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:var(--font);height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:inherit}

/* ── بوابة الدخول ─────────────────────────────────────── */
#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:60;padding:20px}
.gate-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px 26px;
  width:100%;max-width:360px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.gate-box img{height:48px;margin-bottom:14px}
.gate-box h1{font-size:17px;font-weight:800;margin-bottom:4px}
.gate-box p{font-size:12.5px;color:var(--muted);margin-bottom:18px}
.gate-box input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;
  padding:12px 14px;font-size:14px;margin-bottom:9px;outline:none}
.gate-box input:focus{border-color:var(--brand)}
.gbtn{width:100%;background:var(--brand);color:#fff;border:none;padding:12px;border-radius:10px;
  font-weight:800;font-size:14.5px;cursor:pointer}
#gateErr{color:var(--brand);font-size:12.5px;margin-top:9px;min-height:17px}

/* ── الهيكل ───────────────────────────────────────────── */
#app{display:none;height:100vh;flex-direction:column}
#app.on{display:flex}
.topbar{height:var(--hd);flex:none;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 16px}
.topbar img{height:30px}
.topbar .ttl{font-size:16px;font-weight:800}
.topbar .sp{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.ico{width:36px;height:36px;border-radius:50%;border:none;background:none;cursor:pointer;
  font-size:16px;color:var(--muted)}
.ico:hover{background:var(--hover)}
.me{display:flex;align-items:center;gap:8px}
.me b{font-size:13px;display:block;line-height:1.3}
.me span{font-size:11px;color:var(--muted)}
.av{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-weight:800;font-size:14px}
.main{flex:1;display:flex;min-height:0;min-width:0}

/* العمود اليمين: اللستة */
.side{width:380px;flex:none;background:var(--panel);border-inline-start:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.side-top{padding:10px 12px;border-bottom:1px solid var(--line);flex:none}
.search{display:flex;align-items:center;gap:9px;background:var(--bg);border-radius:9px;padding:8px 13px}
.search input{background:none;border:none;outline:none;flex:1;font-size:14px;min-width:0}
.chips{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:5px 13px;border-radius:99px;border:1px solid var(--line2);background:none;
  font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.chip .n{background:var(--brand);color:#fff;border-radius:99px;padding:0 6px;font-size:10.5px;
  margin-inline-start:5px}
.periodSel{width:100%;margin-top:9px;background:var(--bg);border:1px solid var(--line2);
  border-radius:9px;padding:8px 11px;font-size:12.5px;font-weight:700;outline:none}
.list{flex:1;overflow-y:auto;min-height:0}
.row{display:flex;gap:12px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line);
  align-items:center}
.row:hover{background:var(--hover)}
.row.on{background:var(--active)}
.r-av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:16px;flex:none}
.r-b{flex:1;min-width:0}
.r-1{display:flex;align-items:baseline;gap:8px}
.r-1 b{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.r-2{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12.5px;color:var(--muted)}
.tag{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;white-space:nowrap}
.t-ok{background:var(--green-soft);color:var(--green)}
.t-warn{background:var(--orange-soft);color:var(--orange)}
.t-bad{background:var(--brand-soft);color:var(--brand)}
.t-gold{background:var(--gold-soft);color:var(--gold)}
.stars{color:var(--gold);letter-spacing:.5px}
.empty{padding:60px 24px;text-align:center;color:var(--muted);font-size:14px}
.empty i{font-size:44px;font-style:normal;display:block;margin-bottom:12px;opacity:.5}

/* العمود الشمال: التفاصيل */
.pane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.pane-empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
.pane-empty i{font-size:64px;font-style:normal;display:block;margin-bottom:16px;opacity:.35}
.pane-hd{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 20px;
  display:flex;align-items:center;gap:14px;flex:none;flex-wrap:wrap;min-width:0}
.p-av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:19px;flex:none}
.pane-hd .nm{flex:1;min-width:0}
.pane-hd .nm b{font-size:16px;display:block}
.pane-hd .nm span{font-size:12.5px;color:var(--muted)}
.pane-body{flex:1;overflow-y:auto;padding:18px 20px}
.back{display:none;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px}
.kpi .k{font-size:11.5px;color:var(--muted);font-weight:700}
.kpi .v{font-size:22px;font-weight:900;margin-top:3px}
.kpi .s{font-size:11px;color:var(--muted);margin-top:2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}
.card-h{font-size:13.5px;font-weight:800;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--muted)}
.kv b{font-weight:800}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:99px}
.how{background:var(--bg);border:1px dashed var(--line2);border-radius:11px;padding:12px 14px;
  font-size:12px;color:var(--muted);line-height:1.95}
.how b{color:var(--blue)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line2);background:none;color:var(--muted);padding:9px 15px;
  border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:800;text-decoration:none;display:inline-block}
.btn.ok{background:var(--green-soft);color:var(--green);border-color:transparent}
.btn.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.quote{background:var(--bg);border-inline-start:3px solid var(--brand);border-radius:8px;
  padding:11px 13px;font-size:13px;line-height:1.8;margin-top:4px}

/* نافذة */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;
  align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:460px;border-radius:16px 16px 0 0;
  max-height:88vh;display:flex;flex-direction:column;margin-bottom:0}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet-h{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:800;font-size:14.5px}
.sheet-b{padding:18px 20px;overflow-y:auto}
.sheet-b textarea,.sheet-b input{width:100%;background:var(--bg);border:1px solid var(--line2);
  border-radius:10px;padding:11px 13px;font-size:13.5px;outline:none;margin-top:10px;resize:none}
.st{font-size:31px;cursor:pointer;line-height:1}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--txt);color:var(--bg);border-radius:9px;padding:11px 20px;
  font-size:13.5px;font-weight:700;display:none}
#toast.on{display:block}

@media(max-width:820px){
  .side{width:100%;border:none}
  .main.detail .side{display:none}
  .main:not(.detail) .pane{display:none}
  .back{display:block}
  .me b,.me span{display:none}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <img src="assets/logo.png" alt="" onerror="this.style.display='none'" />
    <h1>⭐ إدارة التقييمات</h1>
    <p>قياس أداء الطيارين والفروع والموظفين</p>
    <input id="gUser" placeholder="اسم المستخدم" dir="ltr" autocomplete="username" />
    <input id="gPass" type="password" placeholder="كلمة المرور" dir="ltr" autocomplete="current-password" />
    <button class="gbtn" onclick="doLogin()">دخول</button>
    <div id="gateErr"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <img src="assets/logo.png" alt="" onerror="this.style.display='none'" />
    <div class="ttl">⭐ إدارة التقييمات</div>
    <div class="sp">
      <button class="ico" id="themeBtn" title="الوضع الليلي">🌙</button>
      <button class="ico" onclick="location.href='index.html'" title="البوابة">🏠</button>
      <div class="me"><div class="av" id="meAv">A</div>
        <div><b id="meName">—</b><span id="meRole">—</span></div></div>
      <button class="ico" onclick="doLogout()" title="خروج" style="color:var(--brand)">⏻</button>
    </div>
  </div>

  <div class="main" id="main">
    <div class="side">
      <div class="side-top">
        <div class="search">🔍<input id="q" placeholder="ابحث بالاسم…" autocomplete="off" oninput="renderList()" /></div>
        <div class="chips" id="chips"></div>
        <select class="periodSel" id="period" onchange="refresh()">
          <option value="7">آخر 7 أيام</option>
          <option value="30" selected>آخر 30 يوم</option>
          <option value="90">آخر 90 يوم</option>
          <option value="0">من البداية</option>
        </select>
      </div>
      <div class="list" id="list"></div>
    </div>
    <div class="pane" id="pane">
      <div class="pane-empty"><div><i>⭐</i>اختار من اللستة عشان تشوف التقييم<br />والتفاصيل الكاملة</div></div>
    </div>
  </div>
</div>

<div class="modal" id="modal"><div class="sheet">
  <div class="sheet-h" id="mTitle">—</div>
  <div class="sheet-b" id="mBody"></div>
</div></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, set, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app  = initializeApp({
  apiKey: "AIzaSyAqDGiMVtZ6PQH522ndXEYCBM37WKcI-ws",
  authDomain: "aldahshaneg-92f66.firebaseapp.com",
  databaseURL: "https://aldahshaneg-92f66-default-rtdb.firebaseio.com",
  projectId: "aldahshaneg-92f66"
});
const db = getDatabase(app), auth = getAuth(app);
onAuthStateChanged(auth, u => { if (!u) signInAnonymously(auth).catch(() => {}); });

const $   = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const num = (v, d = 1) => (Number(v) || 0).toFixed(d).replace(/\.0+$/, "");
const initial = s => (String(s || "؟").trim()[0] || "؟");
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 2600); }

/* الثيم */
if (localStorage.getItem("perf-theme") === "dark") document.documentElement.classList.add("dark");
const syncTheme = () => $("themeBtn").textContent =
  document.documentElement.classList.contains("dark") ? "☀️" : "🌙";
syncTheme();
$("themeBtn").onclick = () => {
  const d = document.documentElement.classList.toggle("dark");
  localStorage.setItem("perf-theme", d ? "dark" : "light"); syncTheme();
};

/* ══════════════════════════════════════════════════════════════
   الدخول — نفس جلسة باقي اللوحات
══════════════════════════════════════════════════════════════ */
const ALLOWED = ["مدير", "مدير عام", "admin", "موارد بشرية", "شؤون عاملين", "مشرف"];
let ME = null;

function applySession(s) {
  ME = s;
  $("gate").style.display = "none";
  $("app").classList.add("on");
  $("meName").textContent = s.username;
  $("meRole").textContent = s.role || "";
  $("meAv").textContent = initial(s.username);
  start();
}
window.doLogin = async function () {
  const u = $("gUser").value.trim(), p = $("gPass").value, err = $("gateErr");
  err.textContent = "";
  if (!u || !p) { err.textContent = "اكتب اسم المستخدم وكلمة المرور"; return; }
  try {
    if (!auth.currentUser) { try { await signInAnonymously(auth); } catch (e) {} }
    const snap = await get(ref(db, "users/" + u));
    if (!snap.exists()) { err.textContent = "اسم المستخدم أو كلمة المرور غير صحيحة"; return; }
    const v = snap.val();
    if (v.password !== p) { err.textContent = "اسم المستخدم أو كلمة المرور غير صحيحة"; return; }
    if (!ALLOWED.includes((v.role || "").trim())) {
      err.textContent = "الصفحة دي للإدارة والموارد البشرية بس"; return; }
    const s = { username: u, role: v.role };
    localStorage.setItem("tiar-session", JSON.stringify(s));
    applySession(s);
  } catch (e) { err.textContent = "خطأ في الاتصال: " + e.message; }
};
window.doLogout = function () { localStorage.removeItem("tiar-session"); location.reload(); };
(function () {
  try {
    const s = JSON.parse(localStorage.getItem("tiar-session") || "null");
    if (s && s.username && ALLOWED.includes((s.role || "").trim())) applySession(s);
  } catch (e) {}
})();

/* ══════════════════════════════════════════════════════════════
   البيانات
══════════════════════════════════════════════════════════════ */
const D = { orders: [], pilots: [], shifts: [], users: [], branches: {}, attendance: {} };
let TAB = "pilots", SEL = null;

function start() {
  const on = (path, fn) => onValue(ref(db, path), s => { fn(s.val() || {}); refresh(); });
  on("orders",     v => D.orders  = Object.entries(v).map(([id, o]) => ({ id, ...o })));
  on("pilots",     v => D.pilots  = Object.entries(v).map(([id, o]) => ({ id, ...o })));
  on("shifts",     v => D.shifts  = Object.entries(v).map(([id, o]) => ({ id, ...o })));
  on("users",      v => D.users   = Object.entries(v).map(([k, o]) => ({ username: k, ...o })));
  on("attendance", v => D.attendance = v);
  on("branches",   v => D.branches = v);
}

/* ══════════════════════════════════════════════════════════════
   قاعدة التقييم المتفق عليها
   • العميل ماقيّمش → ممتازة (5)   • 4 أو 5 → ممتازة
   • من 1 لـ3 → الدعم يتواصل ويحل، ولو الشكوى مش واضحة أو مش صحيحة
     يعيد التقييم — وتقييمه هو اللي بيتحسب
══════════════════════════════════════════════════════════════ */
const parcels = o => Math.max(1, (o.deliveries || []).length);
const isDone  = o => (o.status || "") === "تم التسليم";
const isFail  = o => ["لم يتم التوصيل", "ملغي"].includes(o.status || "");

function effectiveStars(o) {
  const r = o.ratings || {};
  if (r.support  && Number(r.support.stars))  return Number(r.support.stars);
  if (r.customer && Number(r.customer.stars)) return Number(r.customer.stars);
  return 5;
}
function needsSupport(o) {
  const c = Number(o.ratings?.customer?.stars || 0);
  return isDone(o) && c >= 1 && c <= 3 && !o.ratings?.support;
}
const avg = l => l.length ? l.reduce((a, b) => a + b, 0) / l.length : 0;
const pct = n => Math.max(0, Math.min(100, n));
const sColor = v => v >= 80 ? "var(--green)" : v >= 60 ? "var(--gold)" : "var(--brand)";
const sTag   = v => v >= 80 ? "t-ok" : v >= 60 ? "t-gold" : "t-bad";
function starsTxt(v, has) {
  if (has === false || !v) return `<span style="color:var(--muted)">— لسه</span>`;
  const f = Math.max(0, Math.min(5, Math.round(v)));
  return `<span class="stars">${"★".repeat(f)}${"☆".repeat(5 - f)}</span> ${num(v, 2)}`;
}
function barHtml(v) {
  return `<div class="bar"><i style="width:${pct(v)}%;background:${sColor(v)}"></i></div>`;
}

function periodStart() { const d = Number($("period").value || 30); return d ? Date.now() - d * 86400000 : 0; }
const inPeriod = iso => { const t = new Date(iso || 0).getTime(); return t && t >= periodStart(); };
const scopedOrders = () => D.orders.filter(o => inPeriod(o.createdAt));

function pilotHours(pid) {
  let ms = 0;
  for (const s of D.shifts) {
    if (s.pilotId !== pid || !s.startedAt) continue;
    const st = new Date(s.startedAt).getTime();
    if (!st || st < periodStart()) continue;
    const en = s.endedAt ? new Date(s.endedAt).getTime() : Date.now();
    if (en > st) ms += en - st;
  }
  return ms / 3600000;
}

/* ── حسابات الطيارين ─────────────────────────────────── */
function pilotRows() {
  const os = scopedOrders();
  const rows = D.pilots.map(p => {
    const mine = os.filter(o => o.pilotId === p.id);
    const done = mine.filter(isDone), fail = mine.filter(isFail);
    const dParcels = done.reduce((s, o) => s + parcels(o), 0);
    const hours = pilotHours(p.id);
    const perHour = hours > 0 ? dParcels / hours : 0;
    const rating = avg(done.map(effectiveStars));
    const base = done.length + fail.length;
    const commit = base ? (done.length / base) * 100 : 100;
    return { id: p.id, name: p.name || "—", branch: D.branches[p.assignedBranchId]?.name || "—",
             mine, done, fail, dParcels, hours, perHour, rating, commit };
  }).filter(r => r.mine.length || r.hours > 0);

  const best = Math.max(0, ...rows.map(r => r.perHour));
  rows.forEach(r => {
    r.prod = best > 0 ? pct((r.perHour / best) * 100) : 0;
    r.score = r.done.length
      ? r.prod * 0.40 + (r.rating / 5) * 100 * 0.35 + r.commit * 0.25
      : r.prod * 0.60 + r.commit * 0.40;
  });
  return rows.sort((a, b) => b.score - a.score);
}

/* ── حسابات الفروع ───────────────────────────────────── */
function branchRows() {
  const by = new Map();
  for (const o of scopedOrders()) {
    const id = o.branchId || "—";
    if (!by.has(id)) by.set(id, []);
    by.get(id).push(o);
  }
  return [...by.entries()].map(([id, list]) => {
    const done = list.filter(isDone), fail = list.filter(isFail);
    const rating = avg(done.map(effectiveStars));
    const base = done.length + fail.length;
    const success = base ? (done.length / base) * 100 : 100;
    return { id, name: D.branches[id]?.name || "—", list, done, fail, rating, success,
             rated: done.filter(o => Number(o.ratings?.customer?.stars || 0)).length,
             low: done.filter(needsSupport).length,
             score: (rating / 5) * 100 * 0.60 + success * 0.40 };
  }).sort((a, b) => b.score - a.score);
}

/* ── حسابات باقي الموظفين ────────────────────────────── */
function staffRows() {
  const from = periodStart(), by = new Map();
  for (const [day, users] of Object.entries(D.attendance || {})) {
    const t = new Date(day).getTime();
    if (from && (!t || t < from)) continue;
    for (const [uname, rec] of Object.entries(users || {})) {
      const ss = Object.values(rec.sessions || {});
      let ms = 0;
      for (const s of ss) {
        if (!s.checkIn) continue;
        const a = new Date(s.checkIn).getTime();
        const b = s.checkOut ? new Date(s.checkOut).getTime()
                : s.lastSeen ? new Date(s.lastSeen).getTime() : a;
        if (b > a) ms += b - a;
      }
      if (!by.has(uname)) by.set(uname, { name: uname, days: new Set(), ms: 0, sessions: 0 });
      const e = by.get(uname); e.days.add(day); e.ms += ms; e.sessions += ss.length;
    }
  }
  const totalDays = Object.keys(D.attendance || {})
    .filter(k => { const t = new Date(k).getTime(); return !from || (t && t >= from); }).length || 1;
  return [...by.values()].map(e => {
    const u = D.users.find(x => x.username === e.name);
    const hours = e.ms / 3600000;
    const attend = pct((e.days.size / totalDays) * 100);
    const perDay = pct((hours / (e.days.size * 8 || 1)) * 100);
    return { id: e.name, name: e.name, role: u?.role || "—", hours, attend, perDay,
             days: e.days.size, totalDays, sessions: e.sessions,
             score: attend * 0.6 + perDay * 0.4 };
  }).sort((a, b) => b.score - a.score);
}

const supportCases  = () => scopedOrders().filter(needsSupport)
  .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
const resolvedCases = () => scopedOrders().filter(o => o.ratings?.support)
  .sort((a, b) => new Date(b.ratings.support.at || 0) - new Date(a.ratings.support.at || 0));

const TABS = [
  { k: "pilots",   t: "🛵 الطيارون" },
  { k: "branches", t: "🏢 الفروع" },
  { k: "staff",    t: "🧑‍💼 الموظفين" },
  { k: "support",  t: "🎧 الشكاوى" },
];
window.setTab = k => { TAB = k; SEL = null; refresh(); $("main").classList.remove("detail"); };
window.openItem = id => { SEL = id; renderList(); renderPane(); $("main").classList.add("detail"); };
window.backList = () => { $("main").classList.remove("detail"); };

function currentRows() {
  return TAB === "pilots"   ? pilotRows()
       : TAB === "branches" ? branchRows()
       : TAB === "staff"    ? staffRows()
       :                      supportCases().map(o => ({ id: o.id, name: o.orderNum || "—", order: o }));
}

window.renderList = function () {
  const q = ($("q").value || "").trim().toLowerCase();
  let rows = currentRows();
  if (q) rows = rows.filter(r => String(r.name).toLowerCase().includes(q));
  const box = $("list");

  if (!rows.length) {
    box.innerHTML = `<div class="empty"><i>${TAB === "support" ? "🎉" : "📭"}</i>${
      TAB === "support" ? "مفيش شكاوى مفتوحة — كله تمام" : "مفيش بيانات في الفترة دي"}</div>`;
    return;
  }

  box.innerHTML = rows.map((r, i) => {
    if (TAB === "support") {
      const o = r.order, st = Number(o.ratings?.customer?.stars || 0);
      return `<div class="row ${SEL === r.id ? "on" : ""}" onclick="openItem('${esc(r.id)}')">
        <div class="r-av" style="background:var(--brand-soft);color:var(--brand)">⚠️</div>
        <div class="r-b">
          <div class="r-1"><b dir="ltr">${esc(o.orderNum || "—")}</b>

          <div class="r-2">${esc(o.ratings?.customer?.note || "من غير ملاحظة")}</div>
        </div></div>`;
    }
    const v = Math.round(r.score);
    return `<div class="row ${SEL === r.id ? "on" : ""}" onclick="openItem('${esc(r.id)}')">
      <div class="r-av" style="background:${sColor(r.score)}1f;color:${sColor(r.score)}">${
        i < 3 ? ["🥇","🥈","🥉"][i] : esc(initial(r.name))}</div>
      <div class="r-b">
        <div class="r-1"><b>${esc(r.name)}</b><span class="tag ${sTag(r.score)}">${v}</span></div>
        <div class="r-2">${
          TAB === "pilots"   ? `${r.dParcels} طرد · ${num(r.perHour, 2)}/ساعة`
        : TAB === "branches" ? `${r.list.length} أوردر · ${r.low ? `<b style="color:var(--brand)">${r.low} شكوى</b>` : "مفيش شكاوى"}`
        :                      `${esc(r.role)} · ${r.days} يوم`}</div>
      </div></div>`;
  }).join("");
};

function paneShell(av, avColor, title, sub, body) {
  return `<div class="pane-hd">

      <div class="p-av" style="background:${avColor}1f;color:${avColor}">${av}</div>
      <div class="nm"><b>${title}</b><span>${sub}</span></div>
    </div><div class="pane-body">${body}</div>`;
}

function renderPane() {
  const pane = $("pane");
  if (!SEL) {
    pane.innerHTML = `<div class="pane-empty"><div><i>⭐</i>اختار من اللستة عشان تشوف التقييم<br />والتفاصيل الكاملة</div></div>`;
    return;
  }
  if (TAB === "support")  return void (pane.innerHTML = paneSupport());
  const r = currentRows().find(x => x.id === SEL);
  if (!r) { SEL = null; return renderPane(); }

}

/* ── إجراءات الدعم ───────────────────────────────────── */
const RATE_LABEL = ["", "سيئة", "مش كويسة", "كويسة", "حلوة", "ممتازة"];
let reStars = 0;
const closeModal = () => $("modal").classList.remove("on");
window.closeModal = closeModal;
$("modal").onclick = e => { if (e.target === $("modal")) closeModal(); };

window.openResolve = function () {
  $("mTitle").textContent = "✅ تسجيل حل المشكلة";
  $("mBody").innerHTML = `
    <div style="font-size:13px;color:var(--muted);line-height:1.9">
      اكتب باختصار المشكلة كانت إيه وإزاي اتحلّت. تقييم العميل هيفضل زي ما هو.</div>
    <textarea id="mNote" rows="4" placeholder="مثال: الطيار اتأخر بسبب زحمة — اتعوّض العميل واعتذرنا"></textarea>
    <div style="display:flex;gap:9px;margin-top:14px">
      <button class="btn" style="flex:1" onclick="closeModal()">إلغاء</button>
      <button class="btn pri" style="flex:1" onclick="saveResolve()">حفظ</button>
    </div>`;
  $("modal").classList.add("on");
};
window.saveResolve = async function () {
  const o = D.orders.find(x => x.id === SEL); if (!o) return;
  const note = $("mNote").value.trim();
  if (!note) { toast("اكتب إيه اللي حصل"); return; }
  try {
    await set(ref(db, `orders/${SEL}/ratings/support`), {
      stars: Number(o.ratings?.customer?.stars || 3),   // تقييم العميل زي ما هو
      note, action: "resolved", by: ME?.username || "", at: new Date().toISOString()
    });
    closeModal(); SEL = null; toast("اتسجّل إن المشكلة اتحلّت ✅");
  } catch (e) { toast("خطأ: " + e.message); }
};

window.openRe = function () {
  const o = D.orders.find(x => x.id === SEL); if (!o) return;
  reStars = 0;
  $("mTitle").textContent = "🔄 إعادة التقييم من الدعم";
  $("mBody").innerHTML = `
    <div style="font-size:13px;color:var(--muted)">تقييم العميل الحالي:
      <b style="color:var(--brand)">${o.ratings?.customer?.stars || 0}/5</b> — هيفضل محفوظ للرجوع ليه</div>
    <div id="reStars" style="margin-top:12px"></div>
    <div id="reLbl" style="font-size:13px;color:var(--gold);font-weight:800;min-height:19px;margin-top:5px"></div>
    <textarea id="mNote" rows="3" placeholder="سبب إعادة التقييم — الشكوى مش دقيقة ولا إيه؟"></textarea>
    <div style="display:flex;gap:9px;margin-top:14px">
      <button class="btn" style="flex:1" onclick="closeModal()">إلغاء</button>
      <button class="btn pri" style="flex:1" onclick="saveRe()">حفظ التقييم</button>
    </div>`;
  drawRe(); $("modal").classList.add("on");
};
function drawRe() {
  $("reStars").innerHTML = [1,2,3,4,5].map(i =>
    `<span class="st" onclick="pickRe(${i})" style="color:${i <= reStars ? "var(--gold)" : "var(--line2)"}">★</span>`).join("");
}
window.pickRe = n => { reStars = n; drawRe(); $("reLbl").textContent = RATE_LABEL[n] || ""; };
window.saveRe = async function () {
  if (!reStars) { toast("اختار التقييم الجديد الأول"); return; }
  const note = $("mNote").value.trim();
  if (!note) { toast("اكتب سبب إعادة التقييم"); return; }
  try {
    await set(ref(db, `orders/${SEL}/ratings/support`), {
      stars: reStars, note, action: "re-rated",
      by: ME?.username || "", at: new Date().toISOString()
    });
    closeModal(); SEL = null; toast("اتحفظ التقييم الجديد ✅");
  } catch (e) { toast("خطأ: " + e.message); }
};

/* ══════════════════════════════════════════════════════════════ */
window.refresh = function () {
  if (!ME) return;
  const open = supportCases().length;
  $("chips").innerHTML = TABS.map(t =>
    `<button class="chip ${TAB === t.k ? "on" : ""}" onclick="setTab('${t.k}')">${t.t}${
      t.k === "support" && open ? `<span class="n">${open}</span>` : ""}</button>`).join("");
  renderList();
  renderPane();
};
