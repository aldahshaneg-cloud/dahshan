<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الدهشان | قياس الأداء</title>
<link rel="icon" href="assets/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0a0a0b; --panel:#15161c; --card:#1c1d24; --night:#08080a;
  --border:#2a2b33; --text:#e8e8ef; --muted:#8b93a7;
  --red:#e8192c; --green:#22c55e; --sky:#0ea5e9; --orange:#f97316; --gold:#f5b800;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Tajawal,system-ui,sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}

/* ── شاشة الدخول ─────────────────────────────────────── */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.lg-box{background:var(--panel);border:1px solid var(--border);border-radius:20px;
  padding:32px 28px;width:100%;max-width:380px;text-align:center}
.lg-box img{height:54px;margin-bottom:16px}
.lg-box h1{font-size:1.15rem;font-weight:900;margin-bottom:4px}
.lg-box p{font-size:.82rem;color:var(--muted);margin-bottom:20px}
.lg-box input{width:100%;background:var(--night);border:1px solid var(--border);
  border-radius:12px;padding:13px 15px;color:var(--text);font-size:.92rem;
  margin-bottom:10px;outline:none}
.lg-box input:focus{border-color:var(--red)}
.lg-box button{width:100%;background:var(--red);color:#fff;border:none;padding:13px;
  border-radius:12px;font-weight:800;font-size:.95rem;cursor:pointer}
.lg-err{color:var(--red);font-size:.8rem;margin-top:10px;min-height:18px}

/* ── الهيكل ──────────────────────────────────────────── */
#app{display:none;min-height:100vh;flex-direction:column}
#app.on{display:flex}
header{background:var(--panel);border-bottom:1px solid var(--border);
  padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header img{height:34px}
header h1{font-size:1rem;font-weight:900;flex:1}
.hbtn{background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:8px 14px;border-radius:9px;cursor:pointer;font-size:.8rem;font-weight:700}
.hbtn:hover{color:var(--text)}
.wrap{padding:20px;max-width:1200px;margin:0 auto;width:100%;flex:1}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{background:var(--card);border:1px solid var(--border);color:var(--muted);
  padding:10px 18px;border-radius:11px;cursor:pointer;font-weight:700;font-size:.87rem}
.tab.on{background:rgba(232,25,44,.13);border-color:rgba(232,25,44,.4);color:var(--red)}
.tab .cnt{background:var(--red);color:#fff;border-radius:20px;padding:1px 7px;
  font-size:.68rem;margin-inline-start:6px}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.bar select,.bar input{background:var(--card);border:1px solid var(--border);
  color:var(--text);padding:9px 13px;border-radius:9px;font-size:.85rem;outline:none}

/* ── كروت الملخّص ────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.kpi .k{font-size:.76rem;color:var(--muted);font-weight:600}
.kpi .v{font-size:1.6rem;font-weight:900;margin-top:5px}
.kpi .s{font-size:.72rem;color:var(--muted);margin-top:3px}

/* ── الجداول ─────────────────────────────────────────── */
.tw{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:640px}
th{background:var(--night);color:var(--muted);font-weight:700;font-size:.76rem;
  padding:12px 10px;text-align:right;white-space:nowrap;position:sticky;top:0}
td{padding:12px 10px;border-top:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}
.name{font-weight:800}
.sub{font-size:.72rem;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:34px;font-size:.88rem}

/* شريط النتيجة */
.score{display:flex;align-items:center;gap:9px;min-width:130px}
.sbar{flex:1;height:7px;background:var(--night);border-radius:20px;overflow:hidden}
.sbar i{display:block;height:100%;border-radius:20px}
.snum{font-weight:900;font-size:.92rem;min-width:34px;text-align:left}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.rank{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  font-weight:900;font-size:.78rem;background:var(--night);color:var(--muted)}
.rank.g1{background:rgba(245,184,0,.18);color:var(--gold)}
.rank.g2{background:rgba(160,160,175,.16);color:#c9c9d2}
.rank.g3{background:rgba(205,127,50,.16);color:#cd7f32}

/* ── الدعم الفني ─────────────────────────────────────── */
.case{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:16px;margin-bottom:12px}
.case.low{border-color:rgba(232,25,44,.35)}
.case-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.case-h b{font-size:.95rem;direction:ltr}
.chip{padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:800}
.c-red{background:rgba(232,25,44,.15);color:var(--red)}
.c-green{background:rgba(34,197,94,.15);color:var(--green)}
.c-gold{background:rgba(245,184,0,.15);color:var(--gold)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts button,.acts a{border:1px solid var(--border);background:transparent;color:var(--muted);
  padding:8px 14px;border-radius:9px;cursor:pointer;font-size:.8rem;font-weight:700;
  text-decoration:none;display:inline-block}
.acts .ok{background:rgba(34,197,94,.13);color:var(--green);border-color:rgba(34,197,94,.35)}
.acts .re{background:rgba(245,184,0,.13);color:var(--gold);border-color:rgba(245,184,0,.35)}
.note{font-size:.82rem;color:var(--muted);margin-top:6px;line-height:1.8}

/* شرح المعادلة */
.how{background:rgba(14,165,233,.06);border:1px solid rgba(14,165,233,.2);
  border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:.78rem;
  color:var(--muted);line-height:2}
.how b{color:var(--sky)}

/* نافذة */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:99;display:none;
  align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--border);border-radius:16px;
  padding:22px;max-width:420px;width:100%}
.modal h3{font-size:1rem;font-weight:900;margin-bottom:14px}
.modal .st{font-size:30px;cursor:pointer;line-height:1}
.modal textarea,.modal input{width:100%;background:var(--night);border:1px solid var(--border);
  border-radius:10px;padding:11px 13px;color:var(--text);font-size:.87rem;outline:none;
  margin-top:10px;resize:none}
.modal .row{display:flex;gap:9px;margin-top:16px}
.modal .row button{flex:1;padding:11px;border-radius:10px;font-weight:800;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.86rem}
.modal .row .pri{background:var(--red);color:#fff;border-color:var(--red)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--panel);border:1px solid var(--border);border-radius:11px;
  padding:12px 20px;font-size:.86rem;font-weight:700;display:none}
#toast.on{display:block}
@media(max-width:600px){.wrap{padding:14px}header{padding:12px 14px}}
</style>
</head>
<body>

<!-- ═══ الدخول ═══ -->
<div id="login">
  <div class="lg-box">
    <img src="assets/logo.png" alt="الدهشان" />
    <h1>📊 قياس الأداء</h1>
    <p>إدارة متخصصة لقياس أداء الطيارين والفروع والموظفين</p>
    <input id="lgUser" placeholder="اسم المستخدم" dir="ltr" autocomplete="username" />
    <input id="lgPass" type="password" placeholder="كلمة المرور" dir="ltr" autocomplete="current-password" />
    <button onclick="doLogin()">دخول</button>
    <div class="lg-err" id="lgErr"></div>
  </div>
</div>

<!-- ═══ التطبيق ═══ -->
<div id="app">
  <header>
    <img src="assets/logo.png" alt="" />
    <h1>📊 قياس الأداء</h1>
    <span class="sub" id="who"></span>
    <button class="hbtn" onclick="location.href='index.html'">← البوابة</button>
    <button class="hbtn" onclick="doLogout()">خروج</button>
  </header>

  <div class="wrap">
    <div class="bar">
      <select id="period" onchange="render()">
        <option value="7">آخر 7 أيام</option>
        <option value="30" selected>آخر 30 يوم</option>
        <option value="90">آخر 90 يوم</option>
        <option value="0">من البداية</option>
      </select>
      <select id="branchFilter" onchange="render()"><option value="">كل الفروع</option></select>
      <span class="sub" id="dataInfo"></span>
    </div>

    <div class="tabs">
      <div class="tab on" data-t="pilots"    onclick="setTab('pilots')">🛵 الطيارون</div>
      <div class="tab"    data-t="branches"  onclick="setTab('branches')">🏢 الفروع والتشغيل</div>
      <div class="tab"    data-t="staff"     onclick="setTab('staff')">🧑‍💼 باقي الموظفين</div>
      <div class="tab"    data-t="support"   onclick="setTab('support')">🎧 الدعم الفني <span class="cnt" id="supCnt">0</span></div>
    </div>

    <div id="body"></div>
  </div>
</div>

<!-- نافذة إعادة التقييم -->
<div class="modal" id="reModal">
  <div class="box">
    <h3>🔄 إعادة التقييم من الدعم</h3>
    <div class="sub" id="reOrder"></div>
    <div style="margin-top:12px" id="reStars"></div>
    <div class="sub" id="reLbl" style="color:var(--gold);font-weight:700;min-height:18px;margin-top:6px"></div>
    <textarea id="reNote" rows="3" placeholder="سبب إعادة التقييم — إيه اللي اتحل أو ليه الشكوى مش صحيحة؟"></textarea>
    <div class="row">
      <button onclick="closeRe()">إلغاء</button>
      <button class="pri" onclick="saveRe()">حفظ التقييم</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, set, update, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqDGiMVtZ6PQH522ndXEYCBM37WKcI-ws",
  authDomain: "aldahshaneg-92f66.firebaseapp.com",
  databaseURL: "https://aldahshaneg-92f66-default-rtdb.firebaseio.com",
  projectId: "aldahshaneg-92f66"
};
const app  = initializeApp(firebaseConfig);
const db   = getDatabase(app);
const auth = getAuth(app);
onAuthStateChanged(auth, u => { if (!u) signInAnonymously(auth).catch(() => {}); });

const $   = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const num = (v, d = 1) => (Number(v) || 0).toFixed(d).replace(/\.0+$/, "");

function toast(m) {
  const t = $("toast"); t.textContent = m; t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 2600);
}

/* ══════════════════════════════════════════════════════════════
   الدخول — نفس جلسة باقي اللوحات (tiar-session)
══════════════════════════════════════════════════════════════ */
const ALLOWED = ["مدير", "مدير عام", "admin", "موارد بشرية", "شؤون عاملين", "مشرف"];
let ME = null;

function applySession(s) {
  ME = s;
  $("login").style.display = "none";
  $("app").classList.add("on");
  $("who").textContent = `${s.username} — ${s.role || ""}`;
  start();
}

window.doLogin = async function () {
  const u = $("lgUser").value.trim(), p = $("lgPass").value;
  const err = $("lgErr"); err.textContent = "";
  if (!u || !p) { err.textContent = "اكتب اسم المستخدم وكلمة المرور"; return; }
  try {
    if (!auth.currentUser) { try { await signInAnonymously(auth); } catch (e) {} }
    const snap = await get(ref(db, "users/" + u));
    if (!snap.exists()) { err.textContent = "اسم المستخدم أو كلمة المرور غير صحيحة"; return; }
    const v = snap.val();
    if (v.password !== p) { err.textContent = "اسم المستخدم أو كلمة المرور غير صحيحة"; return; }
    if (!ALLOWED.includes((v.role || "").trim())) {
      err.textContent = "الصفحة دي للإدارة والموارد البشرية بس"; return;
    }
    const s = { username: u, role: v.role };
    localStorage.setItem("tiar-session", JSON.stringify(s));
    applySession(s);
  } catch (e) { err.textContent = "خطأ في الاتصال: " + e.message; }
};

window.doLogout = function () {
  localStorage.removeItem("tiar-session");
  location.reload();
};

// جلسة محفوظة من أي لوحة تانية على نفس الدومين
(function () {
  try {
    const s = JSON.parse(localStorage.getItem("tiar-session") || "null");
    if (s && s.username && ALLOWED.includes((s.role || "").trim())) applySession(s);
  } catch (e) {}
})();

/* ══════════════════════════════════════════════════════════════
   البيانات
══════════════════════════════════════════════════════════════ */
const D = { orders: [], pilots: [], shifts: [], users: [], branches: {}, attendance: {} };
let TAB = "pilots";

function start() {
  onValue(ref(db, "orders"), s => {
    D.orders = Object.entries(s.val() || {}).map(([id, v]) => ({ id, ...v })); render();
  });
  onValue(ref(db, "pilots"), s => {
    D.pilots = Object.entries(s.val() || {}).map(([id, v]) => ({ id, ...v })); render();
  });
  onValue(ref(db, "shifts"), s => {
    D.shifts = Object.entries(s.val() || {}).map(([id, v]) => ({ id, ...v })); render();
  });
  onValue(ref(db, "users"), s => {
    D.users = Object.entries(s.val() || {}).map(([k, v]) => ({ username: k, ...v })); render();
  });
  onValue(ref(db, "attendance"), s => { D.attendance = s.val() || {}; render(); });
  onValue(ref(db, "branches"), s => {
    D.branches = s.val() || {};
    const sel = $("branchFilter"), cur = sel.value;
    sel.innerHTML = `<option value="">كل الفروع</option>` +
      Object.entries(D.branches).map(([id, b]) =>
        `<option value="${esc(id)}">${esc(b.name || id)}</option>`).join("");
    sel.value = cur;
    render();
  });
}

window.setTab = t => {
  TAB = t;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.t === t));
  render();
};

/* ── الفترة والفلترة ─────────────────────────────────── */
function periodStart() {
  const d = Number($("period").value || 30);
  if (!d) return 0;
  return Date.now() - d * 86400000;
}
function inPeriod(iso) {
  const t = new Date(iso || 0).getTime();
  return t && t >= periodStart();
}
function scopedOrders() {
  const b = $("branchFilter").value;
  return D.orders.filter(o => inPeriod(o.createdAt) && (!b || o.branchId === b));
}

/* ══════════════════════════════════════════════════════════════
   قاعدة التقييم المتفق عليها
   ──────────────────────────────────────────────────────────────
   • العميل ماقيّمش      → تتحسب ممتازة (5)
   • 4 أو 5 نجوم         → ممتازة
   • من 1 لـ 3 نجوم      → بتروح للدعم الفني يتواصل ويحل، ولو الشكوى
                            مش واضحة أو مش صحيحة الدعم بيعيد التقييم
   • تقييم الدعم لو موجود بيغلب تقييم العميل
══════════════════════════════════════════════════════════════ */
const parcels = o => Math.max(1, (o.deliveries || []).length);
const isDone  = o => (o.status || "") === "تم التسليم";
const isFail  = o => ["لم يتم التوصيل", "ملغي"].includes(o.status || "");

/** التقييم الفعّال للأوردر: تقييم الدعم ← تقييم العميل ← 5 (مافيش تقييم) */
function effectiveStars(o) {
  const r = o.ratings || {};
  if (r.support && Number(r.support.stars)) return Number(r.support.stars);
  if (r.customer && Number(r.customer.stars)) return Number(r.customer.stars);
  return 5;                       // ماقيّمش = ممتازة
}
/** محتاج تدخّل الدعم؟ تقييم عميل من 1 لـ 3 ولسه الدعم ماتعاملش معاه */
function needsSupport(o) {
  const r = o.ratings || {};
  const c = Number(r.customer?.stars || 0);
  return isDone(o) && c >= 1 && c <= 3 && !r.support;
}

function avg(list) { return list.length ? list.reduce((a, b) => a + b, 0) / list.length : 0; }
function pct(n) { return Math.max(0, Math.min(100, n)); }
function scoreColor(v) { return v >= 80 ? "var(--green)" : v >= 60 ? "var(--gold)" : "var(--red)"; }
function scoreBar(v) {
  return `<div class="score"><div class="sbar"><i style="width:${pct(v)}%;background:${scoreColor(v)}"></i></div>
    <span class="snum" style="color:${scoreColor(v)}">${Math.round(v)}</span></div>`;
}
/** لو مفيش تسليمات لسه، مانعرضش صفر نجوم — ده بيبان كأنه تقييم وحش */
function starsOf(v, has) {
  if (has === false || !v) return `<span class="sub">— لسه</span>`;
  const f = Math.max(0, Math.min(5, Math.round(v)));
  return `<span class="stars">${"★".repeat(f)}${"☆".repeat(5 - f)}</span>
    <span class="sub" style="margin-inline-start:5px">${num(v, 2)}</span>`;
}

/* ══════════════════════════════════════════════════════════════
   ساعات عمل الطيار — من الورديات
══════════════════════════════════════════════════════════════ */
function pilotHours(pilotId) {
  let ms = 0;
  for (const s of D.shifts) {
    if (s.pilotId !== pilotId || !s.startedAt) continue;
    const st = new Date(s.startedAt).getTime();
    if (!st || st < periodStart()) continue;
    const en = s.endedAt ? new Date(s.endedAt).getTime() : Date.now();
    if (en > st) ms += en - st;
  }
  return ms / 3600000;
}

/* ══════════════════════════════════════════════════════════════
   تقييم الطيارين
   الإنتاجية 40% + تقييم العملاء 35% + الالتزام 25%
══════════════════════════════════════════════════════════════ */
function pilotRows() {
  const os = scopedOrders();
  const rows = D.pilots.map(p => {
    const mine = os.filter(o => o.pilotId === p.id);
    const done = mine.filter(isDone), fail = mine.filter(isFail);
    const dParcels = done.reduce((s, o) => s + parcels(o), 0);
    const hours = pilotHours(p.id);
    const perHour = hours > 0 ? dParcels / hours : 0;
    const rating = avg(done.map(effectiveStars));
    // الالتزام = نسبة اللي سلّمه من اللي خلص فيه فعلًا (مسلَّم + فاشل).
    // الأوردر اللي لسه «جاري التوصيل» مش فشل، فمابيتحسبش ضده.
    const commitBase = done.length + fail.length;
    const commit = commitBase ? (done.length / commitBase) * 100 : 100;
    return { p, mine, done, fail, dParcels, hours, perHour, rating, commit };
  }).filter(r => r.mine.length || r.hours > 0);

  // الإنتاجية نسبية لأحسن معدل في الفترة — عشان المقارنة تبقى عادلة
  // بين الطيارين نفسهم مش مقارنة برقم ثابت من دماغنا
  const best = Math.max(0, ...rows.map(r => r.perHour));
  rows.forEach(r => {
    r.prod  = best > 0 ? pct((r.perHour / best) * 100) : 0;
    // الطيار اللي لسه ماسلّمش حاجة، تقييم العملاء مايتحسبش عليه —
    // بنوزّع وزنه على الإنتاجية والالتزام بدل ما ينزّل درجته ظلم
    r.score = r.done.length
      ? r.prod * 0.40 + (r.rating / 5) * 100 * 0.35 + r.commit * 0.25
      : r.prod * 0.60 + r.commit * 0.40;
  });
  return rows.sort((a, b) => b.score - a.score);
}

function viewPilots() {
  const rows = pilotRows();
  const allDone = rows.reduce((s, r) => s + r.dParcels, 0);
  const allHours = rows.reduce((s, r) => s + r.hours, 0);
  const kpis = `
    <div class="kpis">
      <div class="kpi"><div class="k">طيارين نشطين</div><div class="v">${rows.length}</div></div>
      <div class="kpi"><div class="k">طرود مسلَّمة</div><div class="v">${allDone}</div></div>
      <div class="kpi"><div class="k">ساعات عمل</div><div class="v">${num(allHours)}</div>
        <div class="s">من الورديات المسجّلة</div></div>
      <div class="kpi"><div class="k">معدل الطرود/ساعة</div>
        <div class="v">${allHours > 0 ? num(allDone / allHours, 2) : "—"}</div></div>
      <div class="kpi"><div class="k">متوسط التقييم</div>
        <div class="v" style="color:var(--gold)">${rows.length ? num(avg(rows.map(r => r.rating)), 2) : "—"}</div></div>
    </div>`;

  const how = `<div class="how">
    <b>إزاي بنحسب تقييم الطيار؟</b> الإنتاجية <b>40%</b> (طرود/ساعة عمل، منسوبة لأحسن معدل في الفترة)
    + تقييم العملاء <b>35%</b> + الالتزام <b>25%</b> (نسبة الطرود المسلَّمة من اللي اتكلّف بيها).
    ساعات العمل بتتحسب من ورديات الطيار المسجّلة.
  </div>`;

  if (!rows.length) return kpis + how + `<div class="tw"><div class="empty">مفيش بيانات طيارين في الفترة دي</div></div>`;

  return kpis + how + `<div class="tw"><table>
    <thead><tr><th>#</th><th>الطيار</th><th>التقييم العام</th><th>طرود مسلَّمة</th>
      <th>ساعات</th><th>طرود/ساعة</th><th>تقييم العملاء</th><th>الالتزام</th><th>لم يتم/ملغي</th></tr></thead>
    <tbody>${rows.map((r, i) => `
      <tr>
        <td><span class="rank ${i < 3 ? "g" + (i + 1) : ""}">${i + 1}</span></td>
        <td><div class="name">${esc(r.p.name || "—")}</div>
            <div class="sub">${esc(D.branches[r.p.assignedBranchId]?.name || "—")}</div></td>
        <td>${scoreBar(r.score)}</td>
        <td><b>${r.dParcels}</b></td>
        <td>${num(r.hours)}</td>
        <td><b style="color:var(--sky)">${num(r.perHour, 2)}</b></td>
        <td>${starsOf(r.rating, r.done.length > 0)}</td>
        <td>${num(r.commit, 0)}%</td>
        <td style="color:${r.fail.length ? "var(--red)" : "var(--muted)"}">${r.fail.length}</td>
      </tr>`).join("")}</tbody></table></div>`;
}

/* ══════════════════════════════════════════════════════════════
   تقييم الفروع والتشغيل — تقييم العملاء 60% + نسبة النجاح 40%
══════════════════════════════════════════════════════════════ */
function branchRows() {
  const os = scopedOrders();
  const by = new Map();
  for (const o of os) {
    const id = o.branchId || "—";
    if (!by.has(id)) by.set(id, []);
    by.get(id).push(o);
  }
  const rows = [...by.entries()].map(([id, list]) => {
    const done = list.filter(isDone), fail = list.filter(isFail);
    const rating = avg(done.map(effectiveStars));
    const base = done.length + fail.length;
    const success = base ? (done.length / base) * 100 : 100;
    const rated = done.filter(o => Number(o.ratings?.customer?.stars || 0));
    const low   = done.filter(needsSupport);
    return {
      id, name: D.branches[id]?.name || "—", list, done, fail, rating, success,
      ratedCount: rated.length, low: low.length,
      score: (rating / 5) * 100 * 0.60 + success * 0.40
    };
  }).sort((a, b) => b.score - a.score);
  return rows;
}

function viewBranches() {
  const rows = branchRows();
  const os = scopedOrders();
  const done = os.filter(isDone);
  const ratedCount = done.filter(o => Number(o.ratings?.customer?.stars || 0)).length;

  const kpis = `
    <div class="kpis">
      <div class="kpi"><div class="k">إجمالي الأوردرات</div><div class="v">${os.length}</div></div>
      <div class="kpi"><div class="k">تم التسليم</div><div class="v" style="color:var(--green)">${done.length}</div></div>
      <div class="kpi"><div class="k">تقييم التشغيل العام</div>
        <div class="v" style="color:var(--gold)">${done.length ? num(avg(done.map(effectiveStars)), 2) : "—"}</div>
        <div class="s">من 5</div></div>
      <div class="kpi"><div class="k">قيّمها العملاء فعلًا</div><div class="v">${ratedCount}</div>
        <div class="s">من ${done.length} مسلَّمة</div></div>
      <div class="kpi"><div class="k">محتاجة دعم</div>
        <div class="v" style="color:var(--red)">${done.filter(needsSupport).length}</div></div>
    </div>`;

  const how = `<div class="how">
    <b>قاعدة التقييم:</b> الأوردر اللي العميل ماقيّمهوش <b>بيتحسب ممتاز (5 نجوم)</b>، وكذلك اللي واخد
    4 أو 5. الأوردر اللي واخد من <b>1 لـ 3 نجوم</b> بيروح لتبويب <b>الدعم الفني</b> عشان يتواصل مع
    العميل ويحل المشكلة — ولو الشكوى مش واضحة أو مش صحيحة الدعم بيعيد التقييم، وتقييمه هو اللي بيتحسب.
    <br /><b>تقييم الفرع</b> = تقييم العملاء <b>60%</b> + نسبة نجاح التسليم <b>40%</b>.
  </div>`;

  if (!rows.length) return kpis + how + `<div class="tw"><div class="empty">مفيش أوردرات في الفترة دي</div></div>`;

  return kpis + how + `<div class="tw"><table>
    <thead><tr><th>#</th><th>الفرع</th><th>التقييم العام</th><th>أوردرات</th><th>تم التسليم</th>
      <th>لم يتم/ملغي</th><th>نسبة النجاح</th><th>تقييم العملاء</th><th>قيّموا فعلًا</th><th>محتاجة دعم</th></tr></thead>
    <tbody>${rows.map((r, i) => `
      <tr>
        <td><span class="rank ${i < 3 ? "g" + (i + 1) : ""}">${i + 1}</span></td>
        <td class="name">${esc(r.name)}</td>
        <td>${scoreBar(r.score)}</td>
        <td>${r.list.length}</td>
        <td style="color:var(--green)">${r.done.length}</td>
        <td style="color:${r.fail.length ? "var(--red)" : "var(--muted)"}">${r.fail.length}</td>
        <td>${num(r.success, 0)}%</td>
        <td>${starsOf(r.rating, r.done.length > 0)}</td>
        <td>${r.ratedCount}</td>
        <td style="color:${r.low ? "var(--red)" : "var(--muted)"}"><b>${r.low}</b></td>
      </tr>`).join("")}</tbody></table></div>`;
}

/* ══════════════════════════════════════════════════════════════
   باقي الموظفين — من سجل الحضور
══════════════════════════════════════════════════════════════ */
function staffRows() {
  const from = periodStart();
  const by = new Map();
  for (const [dayKey, users] of Object.entries(D.attendance || {})) {
    const dayT = new Date(dayKey).getTime();
    if (from && (!dayT || dayT < from)) continue;
    for (const [uname, rec] of Object.entries(users || {})) {
      const sessions = Object.values(rec.sessions || {});
      let ms = 0;
      for (const s of sessions) {
        if (!s.checkIn) continue;
        const a = new Date(s.checkIn).getTime();
        const b = s.checkOut ? new Date(s.checkOut).getTime() : (s.lastSeen ? new Date(s.lastSeen).getTime() : a);
        if (b > a) ms += b - a;
      }
      if (!by.has(uname)) by.set(uname, { username: uname, days: new Set(), ms: 0, sessions: 0 });
      const e = by.get(uname);
      e.days.add(dayKey); e.ms += ms; e.sessions += sessions.length;
    }
  }
  const totalDays = new Set(Object.keys(D.attendance || {})
    .filter(k => { const t = new Date(k).getTime(); return !from || (t && t >= from); })).size || 1;

  return [...by.values()].map(e => {
    const u = D.users.find(x => x.username === e.username);
    const hours = e.ms / 3600000;
    const attend = pct((e.days.size / totalDays) * 100);
    return {
      ...e, role: u?.role || "—", hours, attend, totalDays,
      score: attend * 0.6 + pct((hours / (e.days.size * 8 || 1)) * 100) * 0.4
    };
  }).sort((a, b) => b.score - a.score);
}

function viewStaff() {
  const rows = staffRows();
  const how = `<div class="how">
    <b>باقي الموظفين</b> (مشرفين، كول سنتر، محاسبة، موارد بشرية…) بيتقاسوا بالحضور:
    <b>الانتظام 60%</b> (أيام الحضور من أيام الفترة) + <b>ساعات العمل 40%</b> (منسوبة لـ8 ساعات/يوم).
    البيانات من سجل الحضور والانصراف التلقائي.
  </div>`;
  if (!rows.length) return how + `<div class="tw"><div class="empty">مفيش سجلات حضور في الفترة دي</div></div>`;

  return how + `<div class="tw"><table>
    <thead><tr><th>#</th><th>الموظف</th><th>الدور</th><th>التقييم العام</th>
      <th>أيام حضور</th><th>ساعات</th><th>متوسط/يوم</th><th>الانتظام</th></tr></thead>
    <tbody>${rows.map((r, i) => `
      <tr>
        <td><span class="rank ${i < 3 ? "g" + (i + 1) : ""}">${i + 1}</span></td>
        <td class="name">${esc(r.username)}</td>
        <td class="sub">${esc(r.role)}</td>
        <td>${scoreBar(r.score)}</td>
        <td>${r.days.size} <span class="sub">من ${r.totalDays}</span></td>
        <td>${num(r.hours)}</td>
        <td>${num(r.hours / (r.days.size || 1))}</td>
        <td>${num(r.attend, 0)}%</td>
      </tr>`).join("")}</tbody></table></div>`;
}

/* ══════════════════════════════════════════════════════════════
   الدعم الفني — الأوردرات اللي تقييمها من 1 لـ 3
══════════════════════════════════════════════════════════════ */
function supportCases() {
  return scopedOrders().filter(needsSupport)
    .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
}
function resolvedCases() {
  return scopedOrders().filter(o => o.ratings?.support)
    .sort((a, b) => new Date(b.ratings.support.at || 0) - new Date(a.ratings.support.at || 0));
}

function viewSupport() {
  const open = supportCases(), closed = resolvedCases();
  const how = `<div class="how">
    الأوردرات اللي العميل قيّمها من <b>1 لـ 3 نجوم</b> بتظهر هنا. الدعم بيتواصل مع العميل ويحدّد المشكلة ويحلّها.
    لو الشكوى <b>مش واضحة أو مش صحيحة</b>، الدعم يعيد التقييم — والتقييم الجديد هو اللي بيتحسب في أداء
    الطيار والفرع بدل تقييم العميل.
  </div>`;

  const card = o => {
    const d = (o.deliveries || [])[0] || {};
    const r = o.ratings?.customer || {};
    let phone = String(d.receiverPhone || o.customerPhone || o.senderPhone || "").replace(/\D/g, "");
    if (phone.startsWith("0")) phone = "2" + phone;
    return `<div class="case low">
      <div class="case-h">
        <b>${esc(o.orderNum || "—")}</b>
        <span class="chip c-red">${"★".repeat(r.stars || 0)}${"☆".repeat(5 - (r.stars || 0))} ${r.stars || 0}/5</span>
        <span class="sub">${esc(D.branches[o.branchId]?.name || "—")}</span>
        ${o.pilotName ? `<span class="sub">🛵 ${esc(o.pilotName)}</span>` : ""}
      </div>
      ${r.note ? `<div class="note">💬 «${esc(r.note)}»</div>` : `<div class="note">مفيش ملاحظة من العميل</div>`}
      <div class="note">👤 ${esc(r.by || d.receiverName || "—")}
        ${d.receiverPhone ? `· <span dir="ltr">${esc(d.receiverPhone)}</span>` : ""}</div>
      <div class="acts">
        ${phone ? `<a href="tel:${esc(d.receiverPhone || "")}">📞 اتصال</a>
        <a href="https://wa.me/${phone}" target="_blank" rel="noopener">💬 واتساب</a>` : ""}
        <button class="ok" onclick="resolveCase('${esc(o.id)}')">✅ اتواصلت واتحلّت</button>
        <button class="re" onclick="openRe('${esc(o.id)}')">🔄 إعادة التقييم</button>
      </div>
    </div>`;
  };

  const closedCard = o => {
    const s = o.ratings.support;
    return `<div class="case">
      <div class="case-h">
        <b>${esc(o.orderNum || "—")}</b>
        <span class="chip ${s.stars >= 4 ? "c-green" : "c-gold"}">${"★".repeat(s.stars)}${"☆".repeat(5 - s.stars)} ${s.stars}/5</span>
        <span class="chip c-green">${s.action === "resolved" ? "اتحلّت" : "أعاد الدعم التقييم"}</span>
      </div>
      ${s.note ? `<div class="note">📝 ${esc(s.note)}</div>` : ""}
      <div class="note sub">بواسطة ${esc(s.by || "—")} · ${new Date(s.at).toLocaleString("ar-EG")}</div>
    </div>`;
  };

  return how +
    `<h3 style="font-size:.95rem;font-weight:900;margin:6px 0 12px">
      🔴 محتاجة تدخّل (${open.length})</h3>` +
    (open.length ? open.map(card).join("")
                 : `<div class="tw"><div class="empty">مفيش شكاوى مفتوحة — كله تمام 👌</div></div>`) +
    `<h3 style="font-size:.95rem;font-weight:900;margin:22px 0 12px">
      ✅ اتعامل معاها الدعم (${closed.length})</h3>` +
    (closed.length ? closed.map(closedCard).join("")
                   : `<div class="tw"><div class="empty">لسه مفيش حالات متعامل معاها</div></div>`);
}

/* ── إجراءات الدعم ───────────────────────────────────── */
window.resolveCase = async function (id) {
  const o = D.orders.find(x => x.id === id); if (!o) return;
  const note = prompt("اكتب باختصار المشكلة وإزاي اتحلّت:", "");
  if (note === null) return;
  try {
    await set(ref(db, `orders/${id}/ratings/support`), {
      stars: Number(o.ratings?.customer?.stars || 3),   // بنسيب تقييم العميل زي ما هو
      note: note.trim(), action: "resolved",
      by: ME?.username || "", at: new Date().toISOString()
    });
    toast("اتسجّل إن المشكلة اتحلّت ✅");
  } catch (e) { toast("خطأ: " + e.message); }
};

let reId = null, reStars = 0;
const RATE_LABEL = ["", "سيئة", "مش كويسة", "كويسة", "حلوة", "ممتازة"];
window.openRe = function (id) {
  reId = id; reStars = 0;
  const o = D.orders.find(x => x.id === id);
  $("reOrder").textContent = `الأوردر ${o?.orderNum || ""} — تقييم العميل ${o?.ratings?.customer?.stars || 0}/5`;
  $("reNote").value = "";
  drawReStars(); $("reLbl").textContent = "";
  $("reModal").classList.add("on");
};
function drawReStars() {
  $("reStars").innerHTML = [1,2,3,4,5].map(i =>
    `<span class="st" onclick="pickRe(${i})" style="color:${i <= reStars ? "var(--gold)" : "#3a3a44"}">★</span>`).join("");
}
window.pickRe = function (n) { reStars = n; drawReStars(); $("reLbl").textContent = RATE_LABEL[n] || ""; };
window.closeRe = function () { $("reModal").classList.remove("on"); reId = null; };
window.saveRe = async function () {
  if (!reId) return;
  if (!reStars) { toast("اختار التقييم الجديد الأول"); return; }
  const note = $("reNote").value.trim();
  if (!note) { toast("اكتب سبب إعادة التقييم"); return; }
  try {
    await set(ref(db, `orders/${reId}/ratings/support`), {
      stars: reStars, note, action: "re-rated",
      by: ME?.username || "", at: new Date().toISOString()
    });
    closeRe(); toast("اتحفظ التقييم الجديد ✅");
  } catch (e) { toast("خطأ: " + e.message); }
};

/* ══════════════════════════════════════════════════════════════
   الرسم
══════════════════════════════════════════════════════════════ */
function render() {
  if (!ME) return;
  $("supCnt").textContent = supportCases().length;
  $("dataInfo").textContent = `${scopedOrders().length} أوردر في الفترة`;
  $("body").innerHTML =
      TAB === "pilots"   ? viewPilots()
    : TAB === "branches" ? viewBranches()
    : TAB === "staff"    ? viewStaff()
    :                      viewSupport();
}
</script>
