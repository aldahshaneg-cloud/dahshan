# Apache VirtualHost — نظام الدهشان (Laravel)
# انسخه لـ /etc/apache2/sites-available/dahshan.conf وعدّل yourdomain.com
# ثم: a2enmod rewrite deflate headers && a2ensite dahshan && systemctl reload apache2
# وبعدين: certbot --apache -d yourdomain.com   (هيضيف نسخة 443 ويحوّل 80 عليها)

<VirtualHost *:80>
    ServerName yourdomain.com
    DocumentRoot /var/www/dahshan/public

    <Directory /var/www/dahshan/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # كل الكود (app/ config/ database/ vendor/ .env) برا الـDocumentRoot أصلًا،
    # فمفيش وصول مباشر ليه — ده أهم فرق أمني عن هيكل النظام القديم.

    # منع الوصول لملفات حسّاسة لو اتحطت بالغلط في public/
    <FilesMatch "^\.(env|git)|\.(sql|log|md|ini|bak)$">
        Require all denied
    </FilesMatch>

    # ضغط الردود النصية — مهم جدًا هنا: لوحات النظام ملفات كبيرة
    # (callcenter.html وحده 767 كيلو، وردود الاستطلاع ~1.2 ميجا)
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/plain \
                                      application/javascript application/json \
                                      image/svg+xml
    </IfModule>

    # تخزين مؤقت للأصول الثابتة بس — اللوحات نفسها لأ عشان التحديثات توصل
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css            "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType image/png           "access plus 1 year"
        ExpiresByType image/jpeg          "access plus 1 year"
        ExpiresByType image/svg+xml       "access plus 1 year"
    </IfModule>

    # ⚠️ ملفات .html **مش** مكاش — النظام القديم اتعلّم الدرس ده بالطريقة
    # الصعبة (commit 31e3af9: «مفيش Cache-Control — المتصفح كان بيشغّل نسخة
    # قديمة من الكود»). أي تحديث للوحة لازم يوصل فورًا.
    <IfModule mod_headers.c>
        <FilesMatch "\.html$">
            Header set Cache-Control "no-cache, must-revalidate"
        </FilesMatch>
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/dahshan_error.log
    CustomLog ${APACHE_LOG_DIR}/dahshan_access.log combined
</VirtualHost>
